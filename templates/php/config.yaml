generatorName: php
inputSpec: ./schema/openapispec-upsun-processed.json
outputDir: .
packageName: upsun-client
templateDir: ./templates/php
library: psr-18
generateSupportingFiles: true
filesToSkip: ["FormDataProcessor.php"]

additionalProperties:
  invokerPackage: Upsun
  apiPackage: Api
  modelPackage: Model
  srcBasePath: src
  testsBasePath: tests
  composerVendor: upsun
  basePath: https://api.upsun.com
  composerProject: upsun-sdk-php
  licenseName: MIT
  composerPackageName: upsun/upsun-sdk-php
  artifactUrl: https://github.com/upsun/upsun-sdk-php
  developerOrganization: Upsun Advocacy Team
  developerOrganizationUrl: https://www.upsun.com
  sdkDescription: The official Upsun SDK for PHP
  sdkLongDescription: The official **Upsun SDK for PHP**. This SDK provides a PHP interface that maps to the Upsun CLI commands.\nFor more information, read [the documentation](https://docs.upsun.com).
  escapedInvokerPackage: "Upsun\\"
  coreTestPath: ./tests/Core
  generateInterfaces: true
  projectName: Upsun SDK PHP
  authorizationUrl: https://auth.upsun.com/oauth2/token
  authorName: Upsun Advocacy Team
  basicUser: "platform-api-user"
  variableNamingConvention: "camelCase"
  parameterNamingConvention: "camelCase"
  propertyNamingConvention: "camelCase"
  enumPropertyNaming: "camelCase"
  modelPropertyNaming: "camelCase"
  generateEnums: true
  enumClassPrefix: true
  sortModelPropertiesByRequiredFlag: true

files:
  abstract_api.mustache:
    templateType: SupportingFiles
    destinationFilename: AbstractApi.php
    folder: src/Api
  oauth_provider.mustache:
    templateType: SupportingFiles
    destinationFilename: OAuthProvider.php
    folder: src/Core
  ObjectAttributesMapper.mustache:
    templateType: SupportingFiles
    destinationFilename: ObjectAttributesMapper.php
    folder: src/
  ObjectOpenApiFormatsMapper.mustache:
    templateType: SupportingFiles
    destinationFilename: ObjectOpenApiFormatsMapper.php
    folder: src/
  ObjectOpenApiTypesMapper.mustache:
    templateType: SupportingFiles
    destinationFilename: ObjectOpenApiTypesMapper.php
    folder: src/

