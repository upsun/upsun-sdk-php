version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Paris
    # Actions are pinned to commit SHAs, so a new release runs only after its Dependabot PR is merged.
    # Waiting 7 days gives time to find a compromised release. Cooldown does not delay security updates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        update-types:
          - minor
          - patch
