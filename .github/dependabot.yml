version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Paris
    # Wait 7 days after a release before proposing it, to let the registry pull compromised versions.
    # Cooldown does not delay security updates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        update-types:
          - minor
          - patch
