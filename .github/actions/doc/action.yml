name: Generate Documentation
description: Generate documentation of the project
inputs:
  default-runtime-version:
    description: "Version used to setup runtime"
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up runtime
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.default-runtime-version }}
        extensions: mbstring, intl, json, curl

    - name: Install dependencies
      shell: bash
      run: composer run install:ci

    - name: Generate Markdown documentation (with phpDocumentor)
      shell: bash
      run: composer run doc:generate:md

    - name: Generate HTML documentation (with phpDocumentor)
      if: false
      shell: bash
      run: composer run doc:generate:html
