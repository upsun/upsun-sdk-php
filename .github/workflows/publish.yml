name: Publish Release

on:
  release:
    types: [published]

env:
  # Define the primary PHP version for release, build, coverage uploads and badge generation
  PRIMARY_PHP_VERSION: '8.4'


jobs:
  
  doc:
    name: Generate release documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PRIMARY_PHP_VERSION }}
          extensions: mbstring, intl, json, curl

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate PHP documentation (with docs generator)
        if: false
        run: composer run docs

      - name: Generate PHP documentation (with docs open-api-generator)
        if: false
        run: echo TODO
        # uses: openapitools/openapi-generator-cli@v2
        # with:
        #   generator: php
        #   config-file: templates/php/config.yaml
        #   openapi-file: schema/openapispec-upsun-processed.json

  publish:
    name: Publish release to Packagist
    runs-on: ubuntu-latest
    needs: [ doc ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PRIMARY_PHP_VERSION }}
          extensions: mbstring, intl, json, curl

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit --testdox
      
      - name: Publish to Packagist
        if: success()
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"repository":{"url":"https://github.com/${{ github.repository }}"}}' \
            "https://packagist.org/api/update-package?username=platformsh-devrel&apiToken=${{ secrets.PACKAGIST_TOKEN }}"
