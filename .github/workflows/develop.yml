name: Develop CI

on:
  pull_request:
  #push:

jobs:
  quality:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
            ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
            php-version: '8.2'
            tools: composer

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHPCS fix on generated Model and Api classes in src
        run: |
          composer run fix
        continue-on-error: true

      - name: Rector fix on generated Model and Api classes in src
        run: |
          composer run rector
        continue-on-error: true

      - name: Run PHP lint (phpcs)
        # Disabled for now (because need to fix line length issues on Model class name)
        if: false  
        run: composer run lint

      - name: symfony-insight
        # Need to check how to setup symfony insight properly
        if: false
        run: |
          composer require --dev symfony/insight-cli
          ./vendor/bin/insight analyze --level=minor --fail-on=critical

  tests:
    name:  Test on PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: [8.1, 8.2, 8.3, 8.4] 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: mbstring, intl, json, curl

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit
  
  doc:
    name: Generate Documentation
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, json, curl

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate PHP documentation (with docs generator)
        if: false
        run: composer run docs

      - name: Generate PHP documentation (with docs open-api-generator)
        if: false
        run: echo TODO
        # uses: openapitools/openapi-generator-cli@v2
        # with:
        #   generator: php
        #   config-file: templates/php/config.yaml
        #   openapi-file: schema/openapispec-upsun-processed.json

  coverage:
    name: Code Coverage Report
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: xdebug
          extensions: mbstring, intl, json, curl

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        # Do not publish coverage for now
        if: false
        uses: codecov/codecov-action@v3
        with:
          files: coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: [ coverage, quality ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, json, curl

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Build project
        if: false
        run: composer run build
