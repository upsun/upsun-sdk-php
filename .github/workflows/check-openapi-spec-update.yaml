name: Check OpenAPI Spec Update

on:
    schedule:
        -   cron: '0 3 * * *'
    workflow_dispatch: ~
permissions:
    contents: write
env:
    DEFAULT_BRANCH: "main"
jobs:
    check-and-update:
        runs-on: ubuntu-latest
        if: ${{ github.repository_owner == 'upsun' }}

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            -   name: Set up Git
                run: |
                    git config --global user.name "github-actions[bot]"
                    git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            -   name: Download and patch OpenAPI spec
                run: |
                    echo "Download OpenAPI spec..."
                    wget -O ./schema/openapispec-platformsh.json https://proxy.upsun.com/docs/openapispec-platformsh.json

                    echo "Patch OpenAPI spec..."
                    sed -i 's/HTTP access permissions/Http access permissions/g' ./schema/openapispec-platformsh.json

            -   name: Remove existing Api and Model Classes
                run: |
                    rm -Rf src/Api/*
                    rm -Rf src/Model/*

            -   name: Patch openapispec-platformsh.yaml (add deployment/next in the path)
                run: |
                    php templates/pre-processing/preprocess_update_resources.php

            -   name: Patch openapispec-platformsh.yaml (add x-<info> for better generation)
                run: |
                    php templates/pre-processing/preprocess_openapi.php
            
            -   name: Generate code (php)
                uses: openapitools/openapi-generator-cli@v2
                with:
                    generator: php
                    config-file: templates/php/config.yaml
                    openapi-file: schema/openapispec-platformsh.json                    

            -   name: Remove empty phpunit tests from OpenAPI Generator 
                run: |
                    if [ -d "./test" ]; then
                        rm -Rf "./test"
                    fi

            -   name: Create Pull Request if changes
                uses: peter-evans/create-pull-request@v6
                with:
                    token: ${{ secrets.OPENAPI_WORKFLOW_TOKEN }}
                    commit-message: "Update OpenAPI spec"
                    body: "This PR updates the OpenAPI spec from the upstream source and applies formatting changes."
                    author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
                    draft: false
                    delete-branch: false
                    branch: update-openapi-spec
                    title: "[API-BOT] Update OpenAPI spec and regenerate SDK"
                    base: main
                    labels: |
                        report
                        automated pr
                    add-paths: |
                        schema/openapispec-platformsh.json
                        src/
                        tests/
                        docs/
                        
                        
