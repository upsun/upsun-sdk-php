name: Check OpenAPI Spec Update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: ~

permissions:
  contents: write

env:
  DEFAULT_BRANCH: "main"
  # Define the primary PHP version for release, build, coverage uploads and badge generation
  PRIMARY_PHP_VERSION: '8.4'

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'upsun' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        shell: bash
        run: composer run install:ci

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install OpenApiGenerator CLI
        run: composer run spec:generate:install

      - name: Remove existing Api and Model Classes
        run: composer run spec:clean

      - name: Download OpenAPI spec
        run: composer run spec:dl

      - name: Generate Client/Model/Tests code (php)
        run: composer run spec:generate

      - name: Fix all generated API and Model classes
        run: composer run fix:all

      - name: Run API vs Facade coverage analysis
        run: php templates/Coverage/CheckApiCoverage.php

      - name: Read coverage report
        id: coverage
        run: |
          echo "total=$(jq -r '.total_api_methods' api-coverage.json)" >> $GITHUB_OUTPUT
          echo "called=$(jq -r '.called_methods' api-coverage.json)" >> $GITHUB_OUTPUT
          echo "unmapped=$(jq -r '.unmapped_methods | length' api-coverage.json)" >> $GITHUB_OUTPUT
          echo "invalid=$(jq -r '.invalid_facade_calls | length' api-coverage.json)" >> $GITHUB_OUTPUT
          echo "coverage=$(jq -r '.coverage_percentage' api-coverage.json)" >> $GITHUB_OUTPUT

          {
              echo "json<<JSONEOF"
              jq '.' api-coverage.json
              echo "JSONEOF"
          } >> $GITHUB_OUTPUT

      - name: Create Pull Request if changes
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.OPENAPI_WORKFLOW_TOKEN }}
          commit-message: "Update OpenAPI spec"
          body: |
            This PR updates the OpenAPI spec from the upstream source and applies formatting changes.

            🧾 **API Coverage Report**

            - Total API methods: ${{ steps.coverage.outputs.total }}
            - Called from facades: ${{ steps.coverage.outputs.called }}
            - Unmapped API methods: ${{ steps.coverage.outputs.unmapped }}
            - Invalid Facade API calls: ${{ steps.coverage.outputs.invalid }}
            - Coverage: ${{ steps.coverage.outputs.coverage }}%

            <details>
            <summary>📋 Full JSON report</summary>
            <pre><code class="language-json">${{ steps.coverage.outputs.json }}</code></pre>
            </details>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          draft: false
          delete-branch: false
          branch: update-openapi-spec
          title: "[API-BOT] Update OpenAPI spec and regenerate SDK"
          base: main
          labels: |
            report
            automated pr
          add-paths: |
            src/
            tests/
            schema/
